# Copie para wrangler.toml e ajuste. O Worker recusa consultas se ALLOWED_ORIGINS
# estiver vazio ou se os bindings ORACLE_RATE_LIMITER ou AI (Workers AI) não existirem.
name = "lumina-oracle"
main = "cloudflare_worker_code.js"
compatibility_date = "2026-11-01"

[vars]
# Origens que podem chamar o Worker, separadas por vírgula. "*" sozinho é ignorado.
ALLOWED_ORIGINS = "https://luminatarot.app"
# Opcional: modelo do Workers AI tentado antes da cadeia padrão (Gemma 4 26B, depois gpt-oss-120b).
# WORKERS_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Somente para desenvolvimento local (wrangler dev):
# ALLOW_LOCALHOST = "true"

# Limite por IP. Obrigatório em produção.
[[ratelimits]]
name = "ORACLE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Workers AI: o provedor das interpretações, na própria Cloudflare. Obrigatório.
[ai]
binding = "AI"
