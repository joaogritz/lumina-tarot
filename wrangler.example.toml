# Copie para wrangler.toml e ajuste. O Worker recusa consultas se ALLOWED_ORIGINS
# estiver vazio, se o binding ORACLE_RATE_LIMITER não existir ou se não houver provedor
# (GEMINI_API_KEY ou o binding AI).
name = "lumina-oracle"
main = "cloudflare_worker_code.js"
compatibility_date = "2026-11-01"

[vars]
# Origens que podem chamar o Worker, separadas por vírgula. "*" sozinho é ignorado.
ALLOWED_ORIGINS = "https://luminatarot.app"
# Opcionais: modelos usados. O Gemini é tentado uma vez; se falhar, entra o Workers AI.
# GEMINI_MODEL = "gemini-3.5-flash-lite"
# WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Somente para desenvolvimento local (wrangler dev):
# ALLOW_LOCALHOST = "true"

# Limite por IP. Obrigatório em produção.
[[ratelimits]]
name = "ORACLE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Workers AI: segundo provedor, na própria Cloudflare. Recomendado.
[ai]
binding = "AI"

# A chave não fica neste arquivo. Cadastre-a como segredo:
#   npx wrangler secret put GEMINI_API_KEY
