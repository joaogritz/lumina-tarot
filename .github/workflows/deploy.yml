name: Test and Deploy

# Every pull request and push runs the full test suite. Only pushes to main
# (or a manual run on main) publish to GitHub Pages, and only after tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test Application
        run: npm test

      - name: Check Mesa TypeScript and Rules
        run: npm run typecheck && npm run test:mesa

      - name: Build Application
        run: npm run build

      - name: Verify Both Entrypoints
        run: test -f dist/index.html && test -f dist/mesa-3d/index.html

      - name: Install Browser
        run: npx playwright install --with-deps chromium

      - name: Test Mesa in Browser
        run: npm run test:browser

      - name: Upload Browser Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mesa-browser-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Site Build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
