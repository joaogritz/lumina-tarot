name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test Application
        run: npm test

      - name: Check Mesa TypeScript and Rules
        run: npm run typecheck && npm run test:mesa

      - name: Build Application
        run: npm run build

      - name: Verify Both Entrypoints
        run: test -f dist/index.html && test -f dist/mesa-3d/index.html

      - name: Install Browser
        run: npx playwright install --with-deps chromium

      - name: Test Mesa in Browser
        run: npm run test:browser

      - name: Upload Browser Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-browser-results
          path: test-results/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
