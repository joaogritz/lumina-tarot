name: CI

# Every pull request and push to main runs the full test suite. Publishing is done by
# Vercel's GitHub integration (production on main, previews on pull requests).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Application
        run: npm test

      - name: Check Mesa TypeScript and Rules
        run: npm run typecheck && npm run test:mesa

      - name: Build Application
        run: npm run build

      - name: Verify Both Entrypoints
        run: test -f dist/index.html && test -f dist/mesa-3d/index.html

      - name: Install Browser
        run: npx playwright install --with-deps chromium

      - name: Test Mesa in Browser
        run: npm run test:browser

      - name: Upload Browser Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesa-browser-results
          path: test-results/
          if-no-files-found: ignore
