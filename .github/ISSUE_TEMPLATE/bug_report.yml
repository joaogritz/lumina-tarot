name: Relatar um problema
description: Algo não funciona como deveria.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado por avisar! Falhas de segurança devem ser reportadas pelo SECURITY.md, não aqui.
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra a página…
        2. Clique em…
        3. Veja o erro…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Onde
      options: [Mesa principal, Mesa 3D, Sim ou Não, Diário, Grimório / Carta do dia, Outro]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Navegador e aparelho
      placeholder: Chrome 140 no Android, Safari no iPhone 15…
  - type: textarea
    id: extra
    attributes:
      label: Capturas de tela ou mensagens de erro
      description: Não inclua perguntas pessoais feitas nas leituras.
