name: Sugerir uma melhoria
description: Uma ideia para o Lumina.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual necessidade ou problema a ideia resolve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Como você imagina a solução?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
